[project]
name = "memguard"
version = "0.3.0"
description = "Memory safety for machines shared by many coding agents: OOM watchdog + large-load guard"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "psutil>=7.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memguard"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

# Arming the load guard in another project's venv is done by `tools/install_memguard.sh`,
# which writes a `.pth` into that venv's site-packages pointing at this source tree —
# the ONE install path. Nothing is copied, so it never goes stale, and `uv sync` in the
# target project does not prune it.
